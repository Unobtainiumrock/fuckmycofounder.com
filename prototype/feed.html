<!doctype html>
<!-- PROTOTYPE — throwaway. Three variants of the story feed, switchable via
     ?variant= or the floating bar (← → keys). Question under test:
     does the case-ledger design make the feed feel captivating?
     A = The Docket (master–detail ledger)
     B = The Record (document reading stream)
     C = The Evidence Wall (pinned exhibits on ink) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PROTOTYPE — F/MC Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4eddf;--ink:#151515;--red:#ff3b20;--red-dark:#d82b15;--acid:#d8ff3e;
  --white:#fffdf8;--muted:#756e64;--line:rgba(21,21,21,.26);
  --display:Impact,"Arial Narrow",Haettenschweiler,sans-serif;
  --sans:Inter,ui-sans-serif,system-ui,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --serif:Charter,"Iowan Old Style",Georgia,serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --page:clamp(1rem,4vw,4rem);
}
*,*::before,*::after{box-sizing:border-box}
body,h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
html{background:var(--paper)}
body{
  min-width:320px;color:var(--ink);font-family:var(--sans);
  background:var(--paper);
  background-image:radial-gradient(rgba(21,21,21,.12) .55px,transparent .55px);
  background-size:5px 5px;
}
:focus-visible{outline:3px solid var(--acid);outline-offset:2px}

/* ---------- shared chrome ---------- */
.masthead{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1.1rem var(--page);border-bottom:2px solid var(--ink);
}
.masthead .mark{display:flex;gap:.75rem;align-items:center;font-weight:900;text-transform:uppercase}
.mark b{padding:.38rem .45rem;color:var(--white);background:var(--ink);font-family:var(--mono);font-size:.75rem;font-weight:800}
.mark span{font-size:.88rem;letter-spacing:-.03em}
.masthead .docket-meta{font-family:var(--mono);font-size:.62rem;font-weight:800;text-transform:uppercase;text-align:right;color:var(--muted)}
.docket-meta strong{color:var(--ink)}
.pagehead{padding:2.2rem var(--page) 1.4rem;display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.pagehead h1{font-family:var(--display);font-size:clamp(2.6rem,6vw,4.6rem);line-height:.82;text-transform:uppercase;letter-spacing:-.04em}
.pagehead h1 em{font-style:normal;color:var(--red)}
.pagehead .filters{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{
  padding:.45rem .65rem;border:2px solid var(--ink);font-family:var(--mono);
  font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
  background:transparent;transition:transform 140ms var(--ease-out),box-shadow 140ms var(--ease-out);
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.chip:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){
  .chip:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
  .chip[aria-pressed="true"]:hover{box-shadow:3px 3px 0 var(--red)}
}

/* verdict palette */
.v-NTP{--v:#151515;--v-bg:var(--acid)}
.v-YTP{--v:#fffdf8;--v-bg:var(--red)}
.v-ESH{--v:#f4eddf;--v-bg:#151515}
.v-NBD{--v:#151515;--v-bg:transparent}
.stamp{
  display:inline-block;padding:.34rem .5rem;border:2.5px solid var(--v,var(--ink));
  color:var(--v,var(--ink));background:var(--v-bg,transparent);
  font-family:var(--mono);font-size:.62rem;font-weight:900;letter-spacing:.07em;
  transform:rotate(-2deg);
}
.v-NBD .stamp,.stamp.v-NBD{border-style:dashed}

/* the stamp-down: once per document open */
.stamp.stamp-in{animation:stampdown 220ms var(--ease-out) both}
@keyframes stampdown{from{opacity:0;transform:rotate(-2deg) scale(1.4)}to{opacity:1;transform:rotate(-2deg) scale(1)}}

/* receipts (mock redacted screenshot) */
.receipt{border:2px solid var(--ink);background:var(--white);padding:.7rem .8rem;max-width:26rem}
.receipt .rline{display:flex;gap:.5rem;align-items:center;margin:.45rem 0}
.receipt .avatar{width:1.15rem;height:1.15rem;background:var(--ink);flex:none}
.receipt .bubble{font-family:var(--mono);font-size:.66rem;line-height:1.5}
.receipt .redact{background:var(--ink);color:var(--ink);padding:0 .35em;user-select:none}
.receipt figcaption{margin-top:.5rem;font-family:var(--mono);font-size:.55rem;font-weight:800;text-transform:uppercase;color:var(--muted)}

/* vote strip */
.votes{display:flex;gap:.4rem;flex-wrap:wrap}
.vote{
  display:flex;gap:.5rem;align-items:baseline;padding:.5rem .6rem;border:2px solid var(--ink);
  font-family:var(--mono);font-size:.6rem;font-weight:900;letter-spacing:.05em;
  background:var(--white);transition:transform 140ms var(--ease-out),box-shadow 140ms var(--ease-out);
}
.vote:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.vote:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}}
.vote .n{font-size:.72rem}
.vote.lead{background:var(--ink);color:var(--white)}
.vote.lead .n{color:var(--acid)}

/* ---------- VARIANT A · THE DOCKET (master–detail) ---------- */
.vA .layout{display:grid;grid-template-columns:minmax(330px,420px) 1fr;border-top:3px solid var(--ink);min-height:calc(100dvh - 60px)}
.vA .index{border-right:3px solid var(--ink);overflow-y:auto;max-height:calc(100dvh - 60px);position:sticky;top:0}
.vA .index-head{display:flex;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.56rem;font-weight:900;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.vA .row{
  display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;width:100%;text-align:left;
  padding:.9rem 1rem;border-bottom:1px solid var(--line);
  transition:background 140ms var(--ease-out);
}
.vA .row .caseno{font-family:var(--mono);font-size:.56rem;font-weight:800;color:var(--muted)}
.vA .row .charge{grid-column:1;font-family:var(--mono);font-size:.63rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.vA .row .teaser{grid-column:1/-1;font-family:var(--serif);font-size:.85rem;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vA .row .tag{align-self:start;justify-self:end;font-family:var(--mono);font-size:.55rem;font-weight:900;padding:.18rem .32rem;border:1.5px solid var(--v,var(--ink));color:var(--v,var(--ink));background:var(--v-bg,transparent);transform:rotate(-2deg)}
@media(hover:hover) and (pointer:fine){.vA .row:hover{background:rgba(21,21,21,.05)}}
.vA .row[aria-current="true"]{background:var(--ink);color:var(--paper)}
.vA .row[aria-current="true"] .caseno{color:rgba(244,237,223,.6)}
.vA .row[aria-current="true"] .teaser{color:var(--paper)}
.vA .detail{padding:clamp(1.25rem,3.5vw,3rem);display:grid;align-content:start}
.vA .file{
  position:relative;border:3px solid var(--ink);background:var(--white);
  box-shadow:10px 10px 0 rgba(21,21,21,.85);max-width:52rem;
  opacity:1;transform:none;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);
}
.vA .file.swap{opacity:0;transform:scale(.985)}
.vA .file-top{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 1.2rem;border-bottom:2px solid var(--ink);font-family:var(--mono);font-size:.6rem;font-weight:900;letter-spacing:.06em}
.vA .file-body{padding:1.4rem 1.2rem 1.6rem;display:grid;gap:1.15rem}
.vA .file h2{font-family:var(--display);font-size:clamp(1.9rem,3.6vw,3rem);line-height:.85;text-transform:uppercase;letter-spacing:-.03em;max-width:24ch}
.vA .label{font-family:var(--mono);font-size:.56rem;font-weight:900;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.3rem}
.vA .testimony{font-family:var(--serif);font-size:1.06rem;line-height:1.55;max-width:58ch}
.vA .said{font-family:var(--mono);font-size:.78rem;line-height:1.55;padding-left:.9rem;border-left:3px solid var(--red)}
.vA .file-verdict{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1rem 1.2rem;border-top:2px solid var(--ink);background:var(--paper)}
.vA .file .stamp{position:absolute;top:.7rem;right:1rem;font-size:.72rem;padding:.45rem .6rem}

/* ---------- VARIANT B · THE RECORD (reading stream) ---------- */
.vB .stream{max-width:46rem;margin:0 auto;padding:1.5rem var(--page) 7rem;display:grid;gap:2.6rem}
.vB .sheet{
  position:relative;border:2.5px solid var(--ink);background:var(--white);
  box-shadow:8px 8px 0 rgba(21,21,21,.8);
  opacity:0;transform:translateY(6px);animation:sheetin 300ms var(--ease-out) forwards;
}
.vB .sheet:nth-child(odd){transform:translateY(6px) rotate(.35deg)}
.vB .sheet:nth-child(even){transform:translateY(6px) rotate(-.3deg)}
@keyframes sheetin{to{opacity:1;transform:translateY(0) rotate(0)}}
.vB .sheet:nth-child(1){animation-delay:0ms}.vB .sheet:nth-child(2){animation-delay:40ms}
.vB .sheet:nth-child(3){animation-delay:80ms}.vB .sheet:nth-child(4){animation-delay:120ms}
.vB .sheet:nth-child(n+5){animation-delay:150ms}
.vB .sheet-top{display:flex;justify-content:space-between;gap:.8rem;padding:.7rem 1.1rem;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:.58rem;font-weight:900;letter-spacing:.06em;flex-wrap:wrap}
.vB .sheet-top .who{color:var(--muted)}
.vB .sheet-body{padding:1.2rem 1.1rem 1.35rem;display:grid;gap:1rem}
.vB .chargeline{font-family:var(--mono);font-size:.66rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--red-dark)}
.vB .testimony{font-family:var(--serif);font-size:1.05rem;line-height:1.6}
.vB .said{font-family:var(--mono);font-size:.76rem;line-height:1.55;padding-left:.85rem;border-left:3px solid var(--red);color:var(--ink)}
.vB .sheet-foot{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.85rem 1.1rem;border-top:1.5px solid var(--ink);background:var(--paper);flex-wrap:wrap}
.vB .sheet .stamp{position:absolute;top:-.85rem;right:.9rem;box-shadow:3px 3px 0 rgba(21,21,21,.35)}
.vB .comments{font-family:var(--mono);font-size:.58rem;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}

/* ---------- VARIANT C · THE EVIDENCE WALL ---------- */
.vC{background:var(--ink);min-height:100dvh}
.vC .masthead,.vC .pagehead{color:var(--paper);border-color:rgba(244,237,223,.35)}
.vC .masthead .mark b{background:var(--red);color:var(--ink)}
.vC .docket-meta{color:rgba(244,237,223,.55)}.vC .docket-meta strong{color:var(--acid)}
.vC .chip{border-color:rgba(244,237,223,.6);color:var(--paper)}
.vC .chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
@media(hover:hover) and (pointer:fine){.vC .chip:hover{box-shadow:3px 3px 0 var(--red)}}
.vC .wall{columns:3;column-gap:1.1rem;padding:1rem var(--page) 7rem}
.vC .pin{
  break-inside:avoid;margin-bottom:1.1rem;position:relative;
  border:2px solid var(--ink);background:var(--white);
  box-shadow:0 14px 22px rgba(0,0,0,.5);
  transition:transform 180ms var(--ease-out);
}
.vC .pin:nth-child(3n){transform:rotate(.8deg)}
.vC .pin:nth-child(3n+1){transform:rotate(-.7deg)}
.vC .pin:nth-child(5n){transform:rotate(1.3deg)}
@media(hover:hover) and (pointer:fine){.vC .pin:hover{transform:rotate(0) translateY(-3px);z-index:2}}
.vC .pin::before{ /* the pin itself */
  content:"";position:absolute;top:-7px;left:50%;width:13px;height:13px;margin-left:-6px;
  background:var(--red);border:2px solid var(--ink);border-radius:50%;z-index:3;
}
.vC .pin-top{display:flex;justify-content:space-between;padding:.6rem .8rem .35rem;font-family:var(--mono);font-size:.54rem;font-weight:900;letter-spacing:.05em;color:var(--muted)}
.vC .pin-body{padding:.2rem .8rem .9rem;display:grid;gap:.6rem}
.vC .pin .chargeline{font-family:var(--mono);font-size:.6rem;font-weight:900;text-transform:uppercase;color:var(--red-dark)}
.vC .pin .testimony{font-family:var(--serif);font-size:.92rem;line-height:1.5}
.vC .pin .stamp{position:absolute;bottom:.7rem;right:.6rem;opacity:.92;font-size:.56rem}
.vC .pin-foot{display:flex;gap:.7rem;padding:.55rem .8rem;border-top:1px solid var(--line);font-family:var(--mono);font-size:.55rem;font-weight:800;color:var(--muted)}
.vC .pin-foot b{color:var(--ink)}
@media(max-width:1000px){.vC .wall{columns:2}}
@media(max-width:640px){.vC .wall{columns:1}}

/* ---------- VARIANT D · THE LEDGER (trustmrr-derived system) ---------- */
.vD{
  --d-bg:#f5f5f5;--d-card:#ffffff;--d-ink:#0a0a0a;--d-mut:#737373;--d-border:#e5e5e5;
  --d-green:#16a34a;--d-red:#dc2626;--d-amber-bg:#fef3c7;--d-amber:#b45309;
  background:var(--d-bg);min-height:100dvh;color:var(--d-ink);
  font-family:Inconsolata,"SFMono-Regular",Consolas,monospace;
}
.vD *{border-radius:0}
.vD .wrap{max-width:64rem;margin:0 auto;padding:3rem 1rem 6rem}
.vD .hero{text-align:center;display:grid;gap:.9rem;justify-items:center;margin-bottom:3rem}
.vD .hero .lockup{display:flex;gap:.5rem;align-items:center;font-weight:700;font-size:16px;color:var(--d-mut)}
.vD .hero .lockup b{background:var(--d-ink);color:#fff;padding:.2rem .4rem;font-size:12px;border-radius:6px}
.vD .hero h1{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.vD .hero p{max-width:42rem;color:var(--d-mut);font-size:14px;line-height:1.6}
.vD .hero .cta{display:flex;gap:.6rem;width:min(100%,30rem)}
.vD .hero input{
  flex:1;height:40px;padding:0 .9rem;border:1px solid var(--d-border);border-radius:8px;
  background:var(--d-card);font:inherit;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.vD .hero input::placeholder{color:var(--d-mut)}
.vD .btn{
  height:40px;padding:0 1.5rem;border-radius:8px;background:#171717;color:#fff;
  font-size:14px;font-weight:500;transition:background .15s cubic-bezier(.4,0,.2,1);
}
.vD .btn:hover{background:rgba(23,23,23,.9)}
.vD .micronav{font-size:14px;color:var(--d-mut)}
.vD .micronav a{color:inherit;text-decoration:none;margin:0 .35rem}
.vD .micronav a:hover{text-decoration:underline;color:var(--d-ink)}
.vD .kicker{font-size:14px;font-weight:600;color:var(--d-mut);margin:2rem 0 .75rem}
.vD .rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:.5rem;scroll-snap-type:x mandatory;scrollbar-width:none}
.vD .rail::-webkit-scrollbar{display:none}
.vD .mini{
  position:relative;flex:0 0 220px;scroll-snap-align:start;background:rgba(255,255,255,.6);
  border:1px solid var(--d-border);border-radius:10px;padding:12px;display:grid;gap:10px;align-content:start;
  transition:border-color .15s cubic-bezier(.4,0,.2,1),background .15s cubic-bezier(.4,0,.2,1);
}
.vD .mini:hover{border-color:rgba(23,23,23,.3);background:#fff}
.vD .mini .ribbon{
  position:absolute;top:0;right:0;background:var(--d-amber-bg);color:var(--d-amber);
  font-size:9px;font-weight:700;padding:2px 6px;border-radius:0 10px 0 10px;letter-spacing:.04em;
}
.vD .mini .t{font-size:10px;color:var(--d-mut)}
.vD .mini .n{font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vD .mini .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px solid var(--d-border);padding-top:8px}
.vD .stat .l{font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--d-mut)}
.vD .stat .v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.vD .ghost{
  flex:0 0 220px;display:grid;place-items:center;border:2px dashed var(--d-border);border-radius:10px;
  color:var(--d-mut);font-size:14px;transition:border-color .15s,color .15s;
}
.vD .ghost:hover{border-color:rgba(23,23,23,.3);color:var(--d-ink)}
.vD .board{background:var(--d-card);border:1px solid var(--d-border);border-radius:14px;padding:1.25rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.vD .board-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.9rem;flex-wrap:wrap}
.vD .board-head h2{font-size:18px;font-weight:700}
.vD .selects{display:flex;gap:.5rem}
.vD .select{border:1px solid var(--d-border);border-radius:8px;padding:.45rem .75rem;font-size:14px;color:var(--d-ink);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.vD table{width:100%;border-collapse:collapse;font-size:14px}
.vD th{
  text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;
  color:var(--d-mut);padding:8px;border-bottom:1px solid var(--d-border);height:40px;
}
.vD th.r,.vD td.r{text-align:right}
.vD td{padding:8px;border-bottom:1px solid var(--d-border);vertical-align:middle}
.vD tr.case{cursor:pointer;transition:background .15s cubic-bezier(.4,0,.2,1)}
.vD tr.case:hover{background:rgba(245,245,245,.7)}
.vD tr.case:last-child td{border-bottom:0}
.vD .rank{width:50px;font-weight:600;color:var(--d-mut)}
.vD .story .charge-s{font-weight:500}
.vD .story .desc{font-size:12px;color:var(--d-mut);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;max-width:46ch}
.vD .who{display:flex;gap:.5rem;align-items:center;color:var(--d-ink)}
.vD .who .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#171717,#525252);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.vD .num{font-weight:600;font-variant-numeric:tabular-nums}
.vD .lead-NTP{color:var(--d-green);font-weight:700}
.vD .lead-YTP{color:var(--d-red);font-weight:700}
.vD .lead-ESH{color:var(--d-amber);font-weight:700}
.vD .lead-NBD{color:var(--d-mut);font-weight:700}
.vD .trust{display:flex;gap:.5rem;justify-content:center;margin-top:.9rem;font-size:12px;color:var(--d-mut)}
.vD .footer{border-top:1px solid var(--d-border);margin-top:3rem;padding-top:2rem;display:flex;justify-content:space-between;gap:2rem;font-size:14px;color:var(--d-mut);flex-wrap:wrap}
@media(max-width:700px){.vD .col-hide{display:none}}

/* ---------- VARIANT E · THE CASEBOOK (our layout, terminal system + red) ---------- */
.vE{
  --e-bg:#f5f5f4;--e-card:#ffffff;--e-ink:#0a0a0a;--e-mut:#737373;--e-border:#e5e5e5;
  --e-red:#ff3b20;--e-red-t:#d82b15;--e-green:#16a34a;--e-amber:#b45309;--e-amber-bg:#fef3c7;
  --e-ease:cubic-bezier(.23,1,.32,1);
  background:var(--e-bg);min-height:100dvh;color:var(--e-ink);
  font-family:Inconsolata,"SFMono-Regular",Consolas,monospace;
  border-top:3px solid var(--e-red);
}
.vE .topbar{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem clamp(1rem,4vw,2.5rem);border-bottom:1px solid var(--e-border);
  background:rgba(245,245,244,.85);backdrop-filter:blur(12px) saturate(160%);
}
.vE .lockup{display:flex;gap:.5rem;align-items:center;font-weight:800;font-size:14px;letter-spacing:-.01em}
.vE .lockup b{background:var(--e-red);color:#fff;padding:.18rem .4rem;border-radius:6px;font-size:11px;font-weight:800}
.vE .topnav{display:flex;gap:1.1rem;align-items:center;font-size:13px;color:var(--e-mut)}
.vE .topnav a{color:inherit;text-decoration:none}
.vE .topnav a:hover{color:var(--e-ink);text-decoration:underline}
.vE .file-btn{
  background:var(--e-red);color:#fff;font-size:13px;font-weight:700;height:34px;padding:0 1rem;
  border-radius:7px;transition:transform 120ms var(--e-ease),background 150ms;
}

const lead = v => Object.entries(v).sort((a,b)=>b[1]-a[1])[0][0];
const totalVotes = v => Object.values(v).reduce((a,b)=>a+b,0);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function receiptHTML(){
  return `<figure class="receipt" aria-label="Redacted screenshot exhibit">
    <div class="rline"><span class="avatar"></span><span class="bubble"><span class="redact">xxxxxxxx</span> 11:52 PM</span></div>
    <div class="rline"><span class="bubble">hey so small thing, I moved some numbers around in the <span class="redact">xxxxxxxxxx</span>, all vibes, don't stress</span></div>
    <div class="rline"><span class="bubble">also we should sync on how you reacted to this before you react to this</span></div>
    <figcaption>EXHIBIT A · METADATA STRIPPED · REDACTED BY AUTHOR</figcaption>
  </figure>`;
}
function votesHTML(v, big){
  const l = lead(v);
  return `<div class="votes" role="group" aria-label="Verdict votes">` +
    Object.keys(V).map(k=>`<button type="button" class="vote v-${k} ${k===l?"lead":""}" title="${V[k]}">${k} <span class="n">${v[k]}</span></button>`).join("") +
  `</div>`;
}
function chrome(inner, dark){
  return `
  <header class="masthead">
    <div class="mark"><b>F/MC</b><span>Fuck My Cofounder</span></div>
    <div class="docket-meta">PUBLIC DOCKET · <strong>${STORIES.length} OPEN CASES</strong><br>UPDATED CONTINUOUSLY</div>
  </header>

}

/* ---- Variant A: The Docket (master-detail) ---- */
function renderA(root){
  root.className="vA";
  const rows = STORIES.map((s,i)=>`
    <button class="row v-${lead(s.votes)}" data-i="${i}" aria-current="${i===0}">
      <span class="caseno">${s.id} · ${s.time} · ${s.handle}</span>
      <span class="tag">${lead(s.votes)}</span>
      <span class="charge">${esc(s.charge)}</span>
      <span class="teaser">${esc(s.text)}</span>
    </button>`).join("");
  root.innerHTML = chrome(`
  <div class="layout">
    <aside class="index" aria-label="Case index">
      <div class="index-head"><span>CASE</span><span>VERDICT</span></div>
      ${rows}
    </aside>
    <section class="detail" aria-live="polite"><div data-file></div></section>
  </div>`);
  const file = root.querySelector("[data-file]");
  const detail = root.querySelector(".detail");
  function show(i, animate){
    const s = STORIES[i];
    const l = lead(s.votes);
    const paint = ()=>{ file.innerHTML = `
      <article class="file v-${l}">
        <button type="button" class="close-detail" data-close aria-label="Close case">×</button>
        <div class="file-top"><span>F/MC INCIDENT REPORT</span><span>${s.id}</span></div>
        <span class="stamp stamp-in">${V[l]}</span>
        <div class="file-body">
          <div><div class="label">CHARGE</div><h2>${esc(s.charge)}</h2></div>
          <div><div class="label">STATEMENT · ${s.handle} · ${s.time}</div><p class="testimony">${esc(s.text)}</p></div>
          <div><div class="label">WHEN ASKED, THEY SAID</div><p class="said">“${esc(s.quote)}”</p></div>
          ${s.receipt?`<div><div class="label">RECEIPTS</div>${receiptHTML()}</div>`:""}
        </div>
        <div class="file-verdict">
          ${votesHTML(s.votes)}
          <span class="comments" style="font-family:var(--mono);font-size:.6rem;font-weight:800">${s.comments} COMMENTS · ${totalVotes(s.votes)} VERDICTS</span>
        </div>
      </article>`;
      file.querySelector("[data-close]")?.addEventListener("click",()=>detail.classList.remove("open"));
    };
    const f = file.querySelector(".file");
    if(animate && f){ f.classList.add("swap"); setTimeout(paint,180); } else paint();
    root.querySelectorAll(".row").forEach(r=>r.setAttribute("aria-current", r.dataset.i==i));
  }
  root.querySelectorAll(".row").forEach(r=>r.addEventListener("click",()=>{ show(+r.dataset.i,true); detail.classList.add("open"); }));
  show(0,false);
}

        <p class="case-quote">“${esc(s.quote)}”</p>
        <div data-split>${splitHTML(s.votes)}</div>
        <div class="case-foot">
          <div class="vbtns" role="group" aria-label="Cast your verdict">

];

/* ---- Variant G: F's grammar + structured case posts + exhibits ---- */
function renderG(root){
  renderF(root);                       // same timeline chassis
  root.className="vF vG";
  const QUORUM=430;
  // 1. structured composer at top of timeline
  const tl=root.querySelector(".tl");
  const composer=document.createElement("div");
  composer.className="composer";
  composer.innerHTML=`
    <div class="av">+</div>
    <div>
      <div class="prompt">File a report. <b>Three blanks, that's the whole form.</b></div>
      <div class="chargepick" role="group" aria-label="Pick the charge">
        ${[...new Set(STORIES.map(s=>s.charge))].map((c,i)=>`<button type="button" class="cp ${i===0?"on":""}">${esc(c)}</button>`).join("")}
      </div>
      <input class="cfield" placeholder="My cofounder… (what happened)">
      <input class="cfield" placeholder="When asked, they said… (verbatim, we know you have it)">
      <div class="composer-foot">
        <div class="dropzone">⧉ drop receipts — the redaction brush runs before anything uploads</div>
        <button type="button" class="go">File it</button>
      </div>
    </div>`;
  tl.insertBefore(composer, tl.children[1]);
  composer.querySelectorAll(".cp").forEach(b=>b.addEventListener("click",()=>{
    composer.querySelectorAll(".cp").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  }));
  // 2. exhibits strip + verdict stamp on each post
  root.querySelectorAll(".post").forEach(el=>{
    const s=STORIES[+el.dataset.i];
    const body=el.children[1];
    if(s.receipt){
      const ex=document.createElement("div");
      ex.className="exhibits";
      ex.innerHTML=`
        <figure class="exh"><div class="shot">
          <div class="l dark w40"></div><div class="l w85"></div><div class="l w70"></div><div class="l dark w55"></div>
        </div><figcaption class="tagbar"><span>EXHIBIT A</span><span>SLACK</span></figcaption></figure>
        <figure class="exh"><div class="grid"></div>
        <figcaption class="tagbar"><span>EXHIBIT B</span><span>CAP TABLE</span></figcaption></figure>`;
      body.insertBefore(ex, body.querySelector(".poll"));
      el.querySelector(".qbox")?.remove();   // exhibits replace the quote box where receipts exist
    }
    if(totalVotes(s.votes)>QUORUM){
      const st=document.createElement("span");
      const l=lead(s.votes);
      st.className=`stamp-g sg-${l}`;
      st.textContent=`VERDICT · ${V[l]}`;
      el.appendChild(st);
    }
  });
}
const app = document.getElementById("app");
const label = document.querySelector("[data-label]");
function current(){ const k = new URLSearchParams(location.search).get("variant")||"A";
  return Math.max(0, VARIANTS.findIndex(v=>v.key===k)); }
function go(i){
  const v = VARIANTS[(i+VARIANTS.length)%VARIANTS.length];
  const u = new URL(location); u.searchParams.set("variant",v.key); history.replaceState(null,"",u);
  label.textContent = `${v.key} — ${v.name}`;
  window.scrollTo(0,0); v.render(app);
}
document.querySelector("[data-prev]").addEventListener("click",()=>go(current()-1));
document.querySelector("[data-next]").addEventListener("click",()=>go(current()+1));
addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.isContentEditable) return;
  if(e.key==="ArrowLeft") go(current()-1);
  if(e.key==="ArrowRight") go(current()+1);
});
go(current());
</script>
</body>

name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fmcf_test
          POSTGRES_PASSWORD: fmcf_test_password
          POSTGRES_USER: fmcf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmcf_test -d fmcf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:architecture
      - run: pnpm check:unused
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration
        env:
          DATABASE_TEST_URL: postgres://fmcf_test:fmcf_test_password@127.0.0.1:5432/fmcf_test
      - run: pnpm check:file-sizes
      - run: pnpm openspec:validate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: git diff --exit-code
      - run: pnpm test:container
